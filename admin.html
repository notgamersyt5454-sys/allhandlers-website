<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllHandlers Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f1f5f9; min-height: 100vh; }
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box {
      background: white; border-radius: 16px; padding: 2rem;
      max-width: 380px; width: 90%; text-align: center;
    }
    .login-box h2 { margin-bottom: 1rem; color: #0f172a; }
    .login-box input {
      width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0;
      border-radius: 8px; margin-bottom: 0.8rem; font-size: 1rem;
    }
    .login-box button {
      width: 100%; padding: 0.8rem; background: #2563eb; color: white;
      border: none; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 1rem;
    }
    .login-box button:hover { background: #1d4ed8; }
    #loginError { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; }
    #loginSuccess { color: #10b981; font-size: 0.85rem; margin-top: 0.5rem; }

    #adminPanel { display: none; padding: 2rem; max-width: 1000px; margin: 0 auto; }
    .header { background: #0f172a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.2rem; }
    .header button { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .tab-btn { padding: 0.6rem 1.2rem; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; background: white; font-weight: 600; }
    .tab-btn.active { background: #2563eb; color: white; }
    .panel { display: none; background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; }
    .panel.active { display: block; }
    .form-group { margin-bottom: 0.8rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem; }
    .form-group input { width: 100%; padding: 0.7rem; border: 1px solid #e2e8f0; border-radius: 8px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn { padding: 0.7rem 1.5rem; border: none; border-radius: 50px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    .table th, .table td { padding: 0.6rem; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; text-align: left; }
    #notification {
      position: fixed; top: 1rem; right: 1rem; padding: 1rem 1.5rem;
      border-radius: 12px; color: white; font-weight: 600; display: none; z-index: 2000;
    }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 Admin Login</h2>
      <input type="email" id="emailInput" placeholder="Email" value="admin@allhandlers.com">
      <input type="password" id="passwordInput" placeholder="Password">
      <button onclick="login()">Login</button>
      <p id="loginError"></p>
      <p id="loginSuccess"></p>
    </div>
  </div>

  <div id="notification"></div>

  <div id="adminPanel">
    <div class="header">
      <h1>AllHandlers Admin</h1>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('dashboard')">Dashboard</button>
      <button class="tab-btn" onclick="showTab('services')">Services</button>
      <button class="tab-btn" onclick="showTab('offers')">Offers</button>
      <button class="tab-btn" onclick="showTab('addService')">+ Add Service</button>
      <button class="tab-btn" onclick="showTab('addOffer')">+ Add Offer</button>
    </div>

    <div class="panel active" id="panel-dashboard">
      <h2>Overview</h2>
      <p>Services: <strong id="totalServices">0</strong> | Offers: <strong id="totalOffers">0</strong></p>
    </div>

    <div class="panel" id="panel-services">
      <h2>Services</h2>
      <table class="table"><thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead><tbody id="servicesTable"></tbody></table>
    </div>

    <div class="panel" id="panel-offers">
      <h2>Offers</h2>
      <table class="table"><thead><tr><th>Title</th><th>Price</th><th>Action</th></tr></thead><tbody id="offersTable"></tbody></table>
    </div>

    <div class="panel" id="panel-addService">
      <h2>Add Service</h2>
      <div class="form-row">
        <div class="form-group"><label>Name*</label><input id="sName"></div>
        <div class="form-group"><label>Category*</label><input id="sBrand"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Price*</label><input id="sPrice" type="number"></div>
        <div class="form-group"><label>Discounted Price</label><input id="sDiscount" type="number"></div>
      </div>
      <div class="form-group"><label>Image URL</label><input id="sImage"></div>
      <button class="btn btn-primary" onclick="addService()">Add Service</button>
    </div>

    <div class="panel" id="panel-addOffer">
      <h2>Add Offer</h2>
      <div class="form-row">
        <div class="form-group"><label>Title*</label><input id="oTitle"></div>
        <div class="form-group"><label>Expiry Date*</label><input id="oExpiry" type="date"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Original Price*</label><input id="oOriginalPrice" type="number"></div>
        <div class="form-group"><label>Discounted Price*</label><input id="oDiscountedPrice" type="number"></div>
      </div>
      <div class="form-group"><label>Image URL</label><input id="oImage"></div>
      <button class="btn btn-success" onclick="addOffer()">Add Offer</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kfdhijucdkfjpjfxqbfd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmZGhpanVjZGtmanBqZnhxYmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjg4NTksImV4cCI6MjEwNDIwNDg1OX0.xy1-s8DO0NVXbppgHwc7R11RPmWARM-p8mGrjUulSgk';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function notify(msg, type) {
      const n = document.getElementById('notification');
      n.textContent = msg;
      n.style.background = type === 'success' ? '#10b981' : '#ef4444';
      n.style.display = 'block';
      setTimeout(() => n.style.display = 'none', 3000);
    }

    async function login() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      document.getElementById('loginError').textContent = '';
      document.getElementById('loginSuccess').textContent = 'Logging in...';
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        document.getElementById('loginError').textContent = '❌ ' + error.message;
        document.getElementById('loginSuccess').textContent = '';
        return;
      }
      
      document.getElementById('loginSuccess').textContent = '✅ Success!';
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadDashboard();
      notify('✅ Login successful!', 'success');
    }

    async function logout() {
      await supabase.auth.signOut();
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPanel').style.display = 'none';
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'services') loadServicesList();
      if (tab === 'offers') loadOffersList();
      if (tab === 'dashboard') loadDashboard();
    }

    async function loadDashboard() {
      const { data: services } = await supabase.from('products').select('*');
      const { data: offers } = await supabase.from('offers').select('*');
      document.getElementById('totalServices').textContent = services ? services.length : 0;
      document.getElementById('totalOffers').textContent = offers ? offers.length : 0;
    }

    async function loadServicesList() {
      const { data } = await supabase.from('products').select('*');
      document.getElementById('servicesTable').innerHTML = (data || []).map(s => 
        `<tr><td>${s.name}</td><td>Rs. ${Number(s.price).toLocaleString()}</td><td><button class="btn btn-danger" onclick="deleteService(${s.id})">Delete</button></td></tr>`
      ).join('') || '<tr><td colspan="3">No services.</td></tr>';
    }

    async function loadOffersList() {
      const { data } = await supabase.from('offers').select('*');
      document.getElementById('offersTable').innerHTML = (data || []).map(o => 
        `<tr><td>${o.title}</td><td>Rs. ${Number(o.discounted_price).toLocaleString()}</td><td><button class="btn btn-danger" onclick="deleteOffer(${o.id})">Delete</button></td></tr>`
      ).join('') || '<tr><td colspan="3">No offers.</td></tr>';
    }

    async function addService() {
      const name = document.getElementById('sName').value;
      const brand = document.getElementById('sBrand').value;
      const price = document.getElementById('sPrice').value;
      if (!name || !brand || !price) { notify('❌ Fill required fields', 'error'); return; }
      const { error } = await supabase.from('products').insert([{name, brand, price: Number(price), discount_price: document.getElementById('sDiscount').value ? Number(document.getElementById('sDiscount').value) : null, image_url: document.getElementById('sImage').value}]);
      if (error) { notify('❌ ' + error.message, 'error'); return; }
      notify('✅ Service added!', 'success');
    }

    async function addOffer() {
      const title = document.getElementById('oTitle').value;
      const original = Number(document.getElementById('oOriginalPrice').value);
      const discounted = Number(document.getElementById('oDiscountedPrice').value);
      const expiry = document.getElementById('oExpiry').value;
      if (!title || !original || !discounted || !expiry) { notify('❌ Fill required fields', 'error'); return; }
      const { error } = await supabase.from('offers').insert([{title, original_price: original, discounted_price: discounted, discount_percentage: Math.round(((original-discounted)/original)*100), expiry_date: expiry, image_url: document.getElementById('oImage').value, active: true}]);
      if (error) { notify('❌ ' + error.message, 'error'); return; }
      notify('✅ Offer added!', 'success');
    }

    async function deleteService(id) {
      if (!confirm('Delete?')) return;
      await supabase.from('products').delete().eq('id', id);
      notify('✅ Deleted!', 'success');
      loadServicesList();
    }

    async function deleteOffer(id) {
      if (!confirm('Delete?')) return;
      await supabase.from('offers').delete().eq('id', id);
      notify('✅ Deleted!', 'success');
      loadOffersList();
    }
  </script>
</body>
</html>
