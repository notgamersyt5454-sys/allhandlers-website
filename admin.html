<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
</head>
<body>

  <h1>Admin Login</h1>
  
  <input type="text" id="email" placeholder="Email" value="admin@allhandlers.com">
  <br><br>
  <input type="password" id="password" placeholder="Password" value="Admin@12345">
  <br><br>
  <button onclick="login()">Login</button>
  
  <p id="result"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://kfdhijucdkfjpjfxqbfd.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmZGhpanVjZGtmanBqZnhxYmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Mjg4NTksImV4cCI6MjEwNDIwNDg1OX0.xy1-s8DO0NVXbppgHwc7R11RPmWARM-p8mGrjUulSgk'
    );

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      document.getElementById('result').innerHTML = 'Trying...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        document.getElementById('result').innerHTML = 'ERROR: ' + error.message;
      } else {
        document.getElementById('result').innerHTML = 'SUCCESS! User ID: ' + data.user.id;
      }
    }
  </script>

</body>
</html>
